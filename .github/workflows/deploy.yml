name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build

  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    if: github.ref_name != 'main' || vars.PROD_READY == 'true'

    env:
      PROJECT_NAME: ${{ github.ref_name == 'main' && 'sugarcane-prod' || 'sugarcane-staging' }}
      PROJECT_SUBDIR: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      ENV_FILE: .env
      WEB_TAG: ${{ github.ref_name == 'main' && 'latest' || 'develop' }}
      PROFILE_FLAG: ${{ github.ref_name == 'main' && '' || '--profile staging' }}

    steps:
      - name: Resolve deploy host
        id: host
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "deploy_host=${{ secrets.PROD_DROPLET_HOST }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_host=${{ secrets.DROPLET_HOST }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull & Restart web
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.host.outputs.deploy_host }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: PROJECT_NAME,PROJECT_SUBDIR,ENV_FILE,WEB_TAG,PROFILE_FLAG
          script: |
            set -e
            cd /opt/sugarcane/$PROJECT_SUBDIR

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            COMPOSE="docker compose -f docker-compose.prod.yml $PROFILE_FLAG --env-file $ENV_FILE -p $PROJECT_NAME"

            $COMPOSE pull web
            $COMPOSE up -d

            docker image prune -f

  prod-skipped:
    name: Prod deploy skipped (not provisioned)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && vars.PROD_READY != 'true'
    steps:
      - name: Explain skip
        run: |
          echo "prod droplet not provisioned; see iac/handoffs/a1-pulumi.md for how to flip createDroplet=true on the prod stack"
          echo "set the repo variable PROD_READY=true once the droplet exists and PROD_DROPLET_HOST is populated"
